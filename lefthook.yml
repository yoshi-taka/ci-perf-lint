pre-commit:
  commands:
    lint-all:
      run: bun run lint
    audit-all:
      run: bun run audit:static

pre-push:
  commands:
    tag-version-match:
      run: bash scripts/check-tag-version.sh
      priority: 1
    lockfile-sync:
      run: bash scripts/check-lockfile-sync.sh
      priority: 2
