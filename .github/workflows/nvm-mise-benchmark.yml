name: nvm vs mise benchmark

on:
  push:
    branches: [bench/nvm-mise-actions-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.runner }} / ${{ matrix.tool }} / ${{ matrix.trial }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        tool: [nvm, mise]
        trial: [1, 2, 3]
    env:
      BENCH_TOOL: ${{ matrix.tool }}
      BENCH_TRIAL: ${{ matrix.trial }}
      BENCH_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated environment
        run: |
          export BENCH_ROOT="$RUNNER_TEMP/nvm-mise-benchmark"
          echo "BENCH_ROOT=$BENCH_ROOT" >> "$GITHUB_ENV"
          python3 .github/bench/nvm-mise.py prepare
      - name: Cold setup including manager download
        run: python3 .github/bench/nvm-mise.py cold
      - name: Save installed-tool cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BENCH_ROOT }}/data
          key: nvm-mise-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.tool }}-${{ matrix.trial }}
      - name: Move original installation aside and start warm timer
        run: python3 .github/bench/nvm-mise.py rotate
      - name: Restore installed-tool cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.BENCH_ROOT }}/data
          key: nvm-mise-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-${{ matrix.tool }}-${{ matrix.trial }}
          fail-on-cache-miss: true
      - name: Warm setup and identical Node workload
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: python3 .github/bench/nvm-mise.py warm
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nvm-mise-${{ matrix.runner }}-${{ matrix.tool }}-${{ matrix.trial }}
          path: ${{ env.BENCH_ROOT }}/results.json
          if-no-files-found: error
          retention-days: 7
