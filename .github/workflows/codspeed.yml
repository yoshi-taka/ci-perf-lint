name: CodSpeed

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
    branches:
      - main
    # Release tags point to commits already benchmarked by the main push.
    # Keep tag publication separate so one release does not benchmark twice.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks (${{ matrix.shard }})
    # CodSpeed's runner installer rejects ubuntu-latest once it resolves to
    # 26.04 ("Unsupported system"); stay on the supported LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: micro
            repository: ""
            target: ""
          - shard: opencode
            repository: anomalyco/opencode
            target: /tmp/ts-target
          - shard: oxc
            repository: oxc-project/oxc
            target: /tmp/rs-target
          - shard: pytorch
            repository: pytorch/pytorch
            target: /tmp/py-target
    env:
      BENCH_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --minimum-release-age 0

      - name: Record benchmark environment
        run: |
          git rev-parse HEAD
          node -e 'console.log(JSON.stringify({node:process.version,cpu:require("node:os").cpus()[0]?.model}))'

      - name: Clone real-world target
        if: matrix.repository != ''
        env:
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_DIRECTORY: ${{ matrix.target }}
        run: |
          git clone --depth 1 "https://github.com/$TARGET_REPOSITORY.git" "$TARGET_DIRECTORY"
          sha=$(git -C "$TARGET_DIRECTORY" rev-parse HEAD)
          echo "Benchmark target: $TARGET_REPOSITORY@$sha"
          echo "Benchmark target: \`$TARGET_REPOSITORY@$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build benchmark runner
        run: bun build ./bench/run.ts --outdir ./dist --target node --external tinybench --external @codspeed/tinybench-plugin

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: node ./dist/run.js
