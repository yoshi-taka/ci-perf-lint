version: 2.1
jobs:
  test:
    docker: [{image: cimg/openjdk:21.0}]
    steps:
      - checkout
      - run: ./gradlew test
workflows:
  ci:
    jobs:
      - test:
          name: dev-tests
          filters:
            branches:
              only: [develop]
      - test:
          name: prod-tests
          filters:
            branches:
              only: [main]
