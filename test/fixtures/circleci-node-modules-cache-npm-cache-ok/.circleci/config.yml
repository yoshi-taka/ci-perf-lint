version: 2.1
jobs:
  test:
    docker: [{image: cimg/node:22.0}]
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - ~/.npm
workflows:
  ci:
    jobs: [test]
