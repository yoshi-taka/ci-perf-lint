# Source: help-me-mom/ng-mocks (.circleci/config.yml)
version: 2.1
jobs:
  test:
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
      - run:
          name: NPM Install
          command: |
            [[ -d node_modules ]] || npm ci
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
workflows:
  ci:
    jobs:
      - test:
