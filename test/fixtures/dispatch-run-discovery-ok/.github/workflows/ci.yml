name: Dispatch and wait for completion
on: workflow_dispatch
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          run_id=$(gh api "repos/$repo/actions/workflows/$workflow/dispatches" \
            -f ref=main -F return_run_details=true --jq '.workflow_run_id')
          while true; do
            status=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')
            if [ "$status" = completed ]; then break; fi
            sleep 5
          done
