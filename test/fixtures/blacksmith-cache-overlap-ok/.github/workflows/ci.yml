name: Checks
on: push
jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        if: runner.os != 'Linux'
        with:
          key: build
          path: .build
      - uses: useblacksmith/stickydisk@v1
        if: runner.os == 'Linux'
        with:
          key: build
          path: .build
