version: 2.1
jobs:
  test:
    docker: [{image: cimg/openjdk:21.0}]
    steps:
      - checkout
      - run: ./gradlew clean test
  test-coverage-verification:
    docker: [{image: cimg/openjdk:21.0}]
    steps:
      - checkout
      - run: ./gradlew clean test
  test-coverage-report:
    docker: [{image: cimg/openjdk:21.0}]
    steps:
      - checkout
      - run: ./gradlew test jacocoTestReport
workflows:
  ci:
    jobs:
      - test
      - test-coverage-verification:
          name: verify-coverage
          requires: [test]
      - test-coverage-report:
          name: report-coverage
          requires: [test]
