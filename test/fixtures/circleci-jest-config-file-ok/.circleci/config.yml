# Adapted from snyk/cloud-config-parser (.circleci/config.yml)
version: 2.1
defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:24.16
  working_directory: ~/app
jobs:
  test:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Run tests
          command: npx jest --ci
workflows:
  ci:
    jobs:
      - test

