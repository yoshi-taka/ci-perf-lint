version: 2.1
jobs:
    test_frontend:

      docker:
          - image: cimg/node:13.8.0
      steps:
          - checkout
          - restore_cache:
              keys: [frontend-build]
          - run:
              name: Run Frontend Test
              command: |
                cd frontend
                npm install
                npm run test

    test_backend:

      docker:
          - image: cimg/node:13.8.0
      steps:
          - checkout
          - restore_cache:
              keys: [backend-build]
          - run:
              name: Scan Backend
              command: |
                cd backend
                npm install
                npm run test
workflows:
  default:
    jobs:
      - test_frontend:
          requires: [build_frontend]
      - test_backend:
          requires: [build_backend]
