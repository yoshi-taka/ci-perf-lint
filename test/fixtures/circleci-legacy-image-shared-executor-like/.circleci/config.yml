# Trimmed from evilmartians/terraforming-rails .circleci/config.yml
version: 2.1
workflows:
  version: 2
  build_and_test:
    jobs:
      - checkout
      - md_lint:
          requires:
            - checkout
      - spelling:
          requires:
            - checkout
executors:
  ruby:
    docker:
      - image: circleci/ruby:2.6-stretch
jobs:
  checkout:
    executor: ruby
    steps:
      - checkout
      - persist_to_workspace:
          root: .
          paths: .
  md_lint:
    executor: ruby
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Markdown lint
          command: mdl .
  spelling:
    executor: ruby
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Check spelling
          command: forspell .
