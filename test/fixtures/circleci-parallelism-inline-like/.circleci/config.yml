version: 2.1
jobs:
  quality:
    docker: [{image: cimg/python:3.15}]
    parallelism: 4
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "aa:bb:cc"
      - run: |
          python3 -m venv venv
          . venv/bin/activate
          black --check src/
workflows:
  ci:
    jobs: [quality]
