# Adapted from buildkite/agent
env:
  BUILDKITE_AGENT_CACHE_REGISTRY: "agent-cache"
steps:
  - name: ':go: Linux Tests'
    key: test-linux
    command: .buildkite/steps/tests.sh
    parallelism: 2
    plugins:
      - docker-compose#v4.14.0:
          config: .buildkite/docker-compose.yml
          run: agent
  - name: ':mac: macOS Tests'
    key: test-macos
    command: .buildkite/steps/tests.sh
    plugins:
      - docker-compose#v4.14.0:
          config: .buildkite/docker-compose.yml
          run: agent
