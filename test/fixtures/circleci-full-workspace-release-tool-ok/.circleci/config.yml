# Trimmed from zer0-os/zAuction-SDK .circleci/config.yml
version: 2.1
orbs:
  node: circleci/node@4.7.0
defaults: &defaults
  working_directory: ~/repo
  docker:
    - image: cimg/node:20.20
jobs:
  build:
    <<: *defaults
    steps:
      - checkout
      - run: npm test
      - persist_to_workspace:
          root: ~/repo
          paths: .
  deploy-semantic:
    <<: *defaults
    steps:
      - add_ssh_keys:
          fingerprints:
            - "aa:bb:cc"
      - checkout
      - attach_workspace:
          at: ~/repo
      - run: npx semantic-release
  deploy-lerna:
    <<: *defaults
    steps:
      - add_ssh_keys:
          fingerprints:
            - "aa:bb:cc"
      - checkout
      - attach_workspace:
          at: ~/repo
      - run: npx lerna publish
  deploy-goreleaser:
    <<: *defaults
    steps:
      - checkout
      - attach_workspace:
          at: ~/repo
      - run: goreleaser release --rm-dist
workflows:
  version: 2
  build:
    jobs:
      - build
      - deploy-semantic:
          requires: [build]
      - deploy-lerna:
          requires: [build]
      - deploy-goreleaser:
          requires: [build]
