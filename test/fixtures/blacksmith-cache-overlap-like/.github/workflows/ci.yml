name: Checks
on: push
jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: useblacksmith/stickydisk@v1
        with:
          key: npm
          path: ~/.npm
      - run: npm ci
