name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Turbo build cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
