version: 2.1
commands:
  install:
    steps:
      - run: npm ci
jobs:
  test:
    docker: [{image: cimg/node:22.0}]
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
      - install
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
workflows:
  ci:
    jobs: [test]
