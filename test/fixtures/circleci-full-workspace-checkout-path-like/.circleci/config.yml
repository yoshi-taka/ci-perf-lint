# Trimmed from palantir/conjure-python .circleci/config.yml
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:11.0.10-node
    steps:
      - checkout
      - run: ./gradlew --parallel build
      - persist_to_workspace:
          root: '.'
          paths:
            - '.'
  py3:
    docker:
      - image: cimg/python:3.8.12
    working_directory: ~/project/conjure-python-verifier/python
    steps:
      - checkout:
          path: ~/project
      - attach_workspace:
          at: '~/project'
      - run:
          name: Run tests
          command: python -m tox -e py3
workflows:
  version: 2
  build:
    jobs:
      - build
      - py3:
          requires:
            - build
