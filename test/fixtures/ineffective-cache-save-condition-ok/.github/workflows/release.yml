name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Reachable: tag pushes produce refs/tags/* refs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build
        run: cargo build --locked

  save-cache-branch:
    name: Manual branch cache
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Explicit restore-only constant, not an unsatisfiable comparison.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Check
        run: cargo check --locked
